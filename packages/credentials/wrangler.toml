# Test-only wrangler config: @cloudflare/vitest-pool-workers reads it to shape
# the workerd runtime the tests run in (hard invariant 5 — real runtime, no
# mocks). This package deploys nothing; it ships as source inside the engine
# Worker. Unlike @habenula-ai/audit it needs no nodejs_compat: the vault is
# Web Crypto only (crypto.subtle), which matches its no-Node ESLint boundary.
name = "habenula-credentials"
compatibility_date = "2025-04-01"

# The vault unit tests read a 256-bit AES key from `env` to exercise the real
# encryption round-trip inside workerd. This is a fixed test key, never a
# secret — the engine supplies the real key from its own environment.
[vars]
CREDENTIAL_ENCRYPTION_KEY = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
