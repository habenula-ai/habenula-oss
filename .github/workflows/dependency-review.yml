name: Dependency review

# Dormant until the repo is public (the dependency-review API is available on
# public repos; the job is guarded on visibility). Part of the security
# overlay that activates at the open-source launch. Note the
# mirror runs no dependency updater by design — dependency changes flow
# monorepo → release like everything else.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
